runtime: python39  # Use Python 3.9 or newer
entrypoint: gunicorn -b :$PORT main:app  # Runs the Flask app with Gunicorn

handlers:
  - url: /static  # Serve static files (CSS, JS, images)
    static_dir: static
  - url: /.*
    script: auto  # Routes all other requests to Flask

instance_class: F2  # Adjust as needed for better performance

env_variables:
  GEMINI_API_KEY: "your-gemini-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
  CLAUDE_API_KEY: "your-claude-api-key"

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 5

# Optional: Network settings
network:
  forwarded_ports:
    - 11434  # If LLaMA is running locally on this port, you'll need to adjust it for cloud use
