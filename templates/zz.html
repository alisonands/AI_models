<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Conversation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <h1 class="display-4 fw-bold text-primary">AI Model Conversation</h1>
                    <p class="lead text-muted">Choose your models and start the conversation</p>
                </div>

                <div class="input-section mb-4">
                    <div class="mb-3">
                        <label for="modelCount" class="form-label">Number of Models:</label>
                        <select id="modelCount" class="form-select mb-3">
                            <option value="1">1 Model</option>
                            <option value="2">2 Models</option>
                            <option value="3">3 Models</option>
                            <option value="4">4 Models</option>
                        </select>
                    </div>

                    <div id="modelSelectors" class="model-selectors-container mb-4">
                        <!-- Model selectors will be dynamically added here -->
                    </div>

                    <div data-bs-root-margin="0px 0px -40%" data-bs-smooth-scroll="true"
                        class="scrollspy-example bg-body-tertiary p-3 rounded-2" tabindex="0">
                        <div id="response-container">
                            <!-- Responses will be added here -->
                        </div>
                    </div>

                    <div class="card-footer bg-transparent position-absolute">
                        <form id="chatForm">
                            <div class="mb-3">
                                <textarea id="prompt-input" class="form-control" placeholder="Type something..."
                                    rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send to Selected Models</button>
                        </form>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/main.js"></script>
</body>

</html>
