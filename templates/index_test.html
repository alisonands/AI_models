<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>
    <!-- main container  -->
    <div class="container mt-4" style="height: 450px;">
        <!-- width of all contents  -->
        <div class="card mx-auto" style="width: 1100px ;max-width: 1200px;">
            <div class="card-header bg-transparent">
                <div class="navbar">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <label for="modelCount" class="form-label">Number of Models:</label>
                            <select id="modelCount" class="form-select">
                                <option value="1">1 Model</option>
                                <option value="2">2 Models</option>
                                <option value="3">3 Models</option>
                                <option value="4">4 Models</option>
                            </select>
                        </div>

                        <div id="modelSelectors" class="model-selectors-container mb-4">

                        </div>
                    </div>

                    
                </div>
            </div>

            <!-- main text area -->
            <div class="card-body p-4" style="max-height:300px; overflow: auto">

                <!-- individual text message box -->
                <div class="d-fle align-items-baseline mb-4">
                    <!-- avatar -->
                    <div>
                        <img src="" alt="">
                    </div>
                    <!-- text -->
                    <div class="pe-2">
                        <div class="card d-inline-block p-2 px-3 m-1">
                            hihi
                        </div>
                    </div>
                </div>

                <div class="d-fle align-items-baseline text-end justify-content-end mb-4">
                    <!-- text -->
                    <div class="pe-2">
                        <div class="card d-inline-block p-2 px-3 m-1">
                            hihi
                        </div>
                    </div>
                    <!-- avatar -->
                    <div>
                        <img src="" alt="">
                    </div>
                </div>

                <div class="d-fle align-items-baseline mb-4">
                    <!-- avatar -->
                    <div>
                        <img src="" alt="">
                    </div>
                    <!-- text -->
                    <div class="pe-2">
                        <div class="card d-inline-block p-2 px-3 m-1">
                            hihihi
                        </div>
                    </div>
                </div>

            </div>

            <!-- footer  -->
            <div class="card-footer  bottom-0 m-0 p-1" style="width:1100px; max-width: 1200px;">

                <div class="input-group">
                    <div class="input-group-text bg-transparent border-0">
                        <button class="btn btn-light text secondary">
                            <i class="fa fa-user-circle-o"></i>
                        </button>
                    </div>
                    <input class="input form-control border-0" placeholder="Write a message" style="max-width: 1000;">
                    </input>
                    <div class="input-group-text bg-transparent border-0">
                        <button class="btn btn-light text secondary">
                            <i class="fa fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="../static/js/main_test.js"></script>
</body>


</html>
