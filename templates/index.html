<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f8f9fa;
        }
        .card {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="card text-center">
        <h3 class="mb-3">Enter Password</h3>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <button class="btn btn-primary w-100" onclick="checkPassword()">Login</button>
        <p id="error" class="text-danger mt-2" style="display: none;">Incorrect password!</p>
    </div>

    <script>
        function checkPassword() {
            var password = document.getElementById("password").value;
            var correctPassword = "secret123"; // Change this to your actual password
            if (password === correctPassword) {
                window.location.href = "index.html"; // Redirect to index.html
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
