<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Conversation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <!-- main container  -->
    <div class="container mt-4" style="height: 700px;">
        <!-- width of all contents  -->
        <div class="card mx-auto" style="width: 600px ;max-width: 1200px;">
            <div class="card-header bg-transparent">
                <div class="navbar">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <label for="modelCount" class="form-label">Number of Models:</label>
                            <select id="modelCount" class="form-select">
                                <option value="1">1 Model</option>
                                <option value="2">2 Models</option>
                                <option value="3">3 Models</option>
                                <option value="4">4 Models</option>
                            </select>
                        </div>

                        <div id="modelSelectors" class="model-selectors-container mb-4">

                        </div>
                    </div>

                    
                </div>
            </div>

            <!-- main text area -->
            <div class="card-body p-4" style="max-height:300px; overflow: auto" id="response-container">
                <!-- Messages will be dynamically added here -->
            </div>

            <!-- footer -->
            <div class="card-footer bottom-0 m-0 p-1" style="width:600px; max-width: 1200px;">
                <form id="chatForm">
                    <div class="input-group">
                        <div class="input-group-text bg-transparent border-0">
                            <button type="button" class="btn btn-light text-secondary">
                                <i class="fa fa-user-circle-o"></i>
                            </button>
                        </div>
                        <input id="prompt-input" class="form-control border-0" placeholder="Write a message" required>
                        <div class="input-group-text bg-transparent border-0">
                            <button type="submit" class="btn btn-light text-secondary">
                                <i class="fa fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="../static/js/main.js"></script>
</body>


</html>
