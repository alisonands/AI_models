<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Comparison</title>
    <link rel="stylesheet" href="../static/css/mobile.css">
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="header">
                <h1>AI Comparison</h1>
                <p>Compare multiple models</p>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="conversationMode">
                        <div class="switch"></div>
                        <span class="switch-label">Conversation Mode</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">Models</label>
                    <select id="modelCount">
                        <option value="1">1 Model</option>
                        <option value="2">2 Models</option>
                        <option value="3">3 Models</option>
                        <option value="4">4 Models</option>
                    </select>
                </div>

                <div id="modelSelectors"></div>
            </div>

            <div class="action-buttons">
                <button class="btn" id="refreshButton">
                    <span>↻</span> Reset
                </button>
            </div>
        </div>

        <div class="chat-area">
            <div class="mobile-header">
                <h1>AI Comparison</h1>
                <button class="menu-btn" id="menuBtn">☰</button>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <form id="chatForm">
                    <div class="input-wrapper">
                        <div class="input-container">
                            <input 
                                type="text" 
                                id="promptInput" 
                                placeholder="Ask something..."
                                autocomplete="off"
                            >
                        </div>
                        <button type="submit" class="send-btn">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../static/js/mobile.js"></script>
</body>
</html>
