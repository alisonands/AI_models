<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151515;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666666;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #252525;
            --border-light: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            transition: transform 0.3s ease;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .controls {
            flex: 1;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-switch:hover {
            background: var(--border-light);
        }

        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: var(--border);
            border-radius: 11px;
            transition: background 0.2s;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--text-tertiary);
            border-radius: 50%;
            transition: all 0.2s;
        }

        input[type="checkbox"]:checked + .switch {
            background: var(--accent);
        }

        input[type="checkbox"]:checked + .switch::after {
            left: 20px;
            background: white;
        }

        input[type="checkbox"] {
            display: none;
        }

        .switch-label {
            font-size: 14px;
            color: var(--text-primary);
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover {
            border-color: var(--border-light);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .model-selector {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .model-selector:hover {
            border-color: var(--border-light);
        }

        .model-number {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background: var(--border-light);
            color: var(--text-primary);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 32px;
            max-width: 800px;
        }

        .message.user {
            margin-left: auto;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--accent);
            color: white;
        }

        .message-name {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .message-content {
            padding: 16px 18px;
            background: var(--bg-secondary);
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid var(--border);
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--bg-tertiary);
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 24px 32px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            width: 100%;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            width: 100%;
        }

        .input-container {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="text"]::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            padding: 14px 20px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Model specific colors */
        .avatar.gemini { background: linear-gradient(135deg, #8e44ad, #3498db); color: white; }
        .avatar.openai { background: linear-gradient(135deg, #10a37f, #1a7f64); color: white; }
        .avatar.claude { background: linear-gradient(135deg, #d97757, #cc5533); color: white; }
        .avatar.deepseek { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .avatar.llama { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }

        /* Mobile Menu */
        .mobile-header {
            display: none;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        .mobile-header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .menu-btn {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 18px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 1000;
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .mobile-header {
                display: flex;
            }

            .messages {
                padding: 16px;
            }

            .input-area {
                padding: 16px;
            }

            .input-wrapper {
                max-width: 100%;
            }

            .message {
                max-width: 100%;
            }

            .send-btn {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            .messages {
                padding: 12px;
            }

            .input-area {
                padding: 12px;
            }

            .message {
                margin-bottom: 20px;
            }

            .message-content {
                padding: 12px 14px;
                font-size: 13px;
            }

            input[type="text"] {
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="header">
                <h1>AI Comparison</h1>
                <p>Compare multiple models</p>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="conversationMode">
                        <div class="switch"></div>
                        <span class="switch-label">Conversation Mode</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">Models</label>
                    <select id="modelCount">
                        <option value="1">1 Model</option>
                        <option value="2">2 Models</option>
                        <option value="3">3 Models</option>
                        <option value="4">4 Models</option>
                    </select>
                </div>

                <div id="modelSelectors"></div>
            </div>

            <div class="action-buttons">
                <button class="btn" id="refreshButton">
                    <span>↻</span> Reset
                </button>
            </div>
        </div>

        <div class="chat-area">
            <div class="mobile-header">
                <h1>AI Comparison</h1>
                <button class="menu-btn" id="menuBtn">☰</button>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <form id="chatForm">
                    <div class="input-wrapper">
                        <div class="input-container">
                            <input 
                                type="text" 
                                id="promptInput" 
                                placeholder="Ask something..."
                                autocomplete="off"
                            >
                        </div>
                        <button type="submit" class="send-btn">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const modelCount = document.getElementById('modelCount');
        const modelSelectors = document.getElementById('modelSelectors');
        const chatForm = document.getElementById('chatForm');
        const messages = document.getElementById('messages');
        const conversationMode = document.getElementById('conversationMode');
        const promptInput = document.getElementById('promptInput');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        const modelOptions = [
            { value: 'gemini-2_5-pro', label: 'Gemini 2.5 Pro' },
            { value: 'openai-o3-mini', label: 'GPT o3 Mini' },
            { value: 'openai-o1', label: 'GPT o1' },
            { value: 'openai-4o', label: 'GPT-4o' },
            { value: 'openai-4o-mini', label: 'GPT-4o Mini' },
            { value: 'openai-4_5_preview', label: 'GPT-4.5 Preview' },
            { value: 'claude_3_7_sonnet', label: 'Claude 3.7 Sonnet' },
            { value: 'claude_3_opus', label: 'Claude 3 Opus' },
            { value: 'claude_3_haiku', label: 'Claude 3 Haiku' },
            { value: 'deepseek_chat', label: 'Deepseek Chat' },
            { value: 'deepseek_reasoner', label: 'Deepseek Reasoner' },
            { value: 'llama3_3', label: 'Llama 3.3' }
        ];

        // Mobile menu toggle
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        function getModelClass(model) {
            if (model.includes('gemini')) return 'gemini';
            if (model.includes('openai')) return 'openai';
            if (model.includes('claude')) return 'claude';
            if (model.includes('deepseek')) return 'deepseek';
            if (model.includes('llama')) return 'llama';
            return '';
        }

        function createModelSelector(index) {
            const options = modelOptions.map(opt => 
                `<option value="${opt.value}">${opt.label}</option>`
            ).join('');

            return `
                <div class="model-selector">
                    <span class="model-number">Model ${index + 1}</span>
                    <select class="model-select">
                        ${options}
                    </select>
                </div>
            `;
        }

        function displayUserMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.innerHTML = `
                <div class="message-header">
                    <div class="avatar">U</div>
                    <div class="message-name">You</div>
                </div>
                <div class="message-content">${text}</div>
            `;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function displayModelResponse(model, response) {
            const existing = document.querySelector(`.loading[data-model="${model}"]`);
            if (existing) existing.remove();

            const modelClass = getModelClass(model);
            const initial = model.charAt(0).toUpperCase();
            const html = marked.parse(response.replace(/\\n/g, '\n'));

            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `
                <div class="message-header">
                    <div class="avatar ${modelClass}">${initial}</div>
                    <div class="message-name">${model}</div>
                </div>
                <div class="message-content">${html}</div>
            `;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function displayLoading(model) {
            const modelClass = getModelClass(model);
            const initial = model.charAt(0).toUpperCase();

            const msg = document.createElement('div');
            msg.className = 'message loading';
            msg.setAttribute('data-model', model);
            msg.innerHTML = `
                <div class="message-header">
                    <div class="avatar ${modelClass}">${initial}</div>
                    <div class="message-name">${model}</div>
                </div>
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        modelCount.addEventListener('change', () => {
            const count = parseInt(modelCount.value);
            modelSelectors.innerHTML = '';
            for (let i = 0; i < count; i++) {
                modelSelectors.innerHTML += createModelSelector(i);
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            const selectedModels = Array.from(document.querySelectorAll('.model-select')).map(s => s.value);

            // Close mobile menu if open
            sidebar.classList.remove('active');
            overlay.classList.remove('active');

            if (selectedModels.length === 0) return;

            if (prompt) displayUserMessage(prompt);
            promptInput.value = '';

            if (conversationMode.checked) {
                displayLoading(selectedModels[0]);
                
                try {
                    const response = await fetch('/conversation', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt, models: selectedModels })
                    });
                    
                    const data = await response.json();
                    
                    if (data.responses) {
                        for (let i = 0; i < data.responses.length; i++) {
                            const r = data.responses[i];
                            displayModelResponse(r.model, r.response);
                            if (i < data.responses.length - 1) {
                                await new Promise(resolve => setTimeout(resolve, 300));
                                displayLoading(selectedModels[i + 1]);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            } else {
                if (!prompt) return;
                
                selectedModels.forEach(displayLoading);
                
                selectedModels.forEach(async (model) => {
                    try {
                        const response = await fetch(`/chat/${model}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt })
                        });
                        const data = await response.json();
                        displayModelResponse(model, data.response);
                    } catch (error) {
                        displayModelResponse(model, `Error: ${error.message}`);
                    }
                });
            }
        });

        document.getElementById('refreshButton').addEventListener('click', async () => {
            try {
                await fetch('/reset_conversations', { method: 'POST' });
                messages.innerHTML = '';
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Initialize
        modelCount.dispatchEvent(new Event('change'));
    </script>
</body>
</html>
